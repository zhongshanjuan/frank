name: PNPM Install

on:
  push:
    branches:
      - main  # 当向 main 分支推送代码时触发此工作流

jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新的 Ubuntu 系统作为运行环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # 检出代码到运行环境

      - name: Set up Node.js
        uses: actions/setup-node@v3  # 设置 Node.js 环境
        with:
          node-version: 20  # 使用 Node.js 18 版本

      - name: Install pnpm
        run: npm install -g pnpm  # 全局安装 pnpm

      - name: Change directory and install dependencies
        run: |
          cd src  # 进入 src 目录
          pnpm install  # 安装依赖
    